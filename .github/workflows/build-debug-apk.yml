name: Build Debug APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'debug/**'
      - '*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web bundle
        run: |
          npm ci
          npm run build

      - name: Sync web assets to Android & Capacitor
        run: |
          rm -rf app/src/main/assets/public
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/
          if [ -d "android" ]; then
            npx cap sync android
          fi

      - name: Build Debug APK
        run: |
          if [ -d "android" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../debug/debug.apk
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk debug/debug.apk
          fi

      - name: Commit debug/debug.apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug/debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update debug/debug.apk [skip ci]"
            git push
          fi
