name: Build Debug APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'debug/**'
      - '*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies and build web bundle
        run: |
          npm ci || npm install
          npm run build

      - name: Sync web assets to Android
        run: |
          rm -rf app/src/main/assets/public
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/

      - name: Build Debug APK
        run: |
          mkdir -p debug
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk debug/debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortal-hand-3d-debug-apk
          path: debug/debug.apk

      - name: Commit debug/debug.apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- package-lock.json app/src/main/assets/public 2>/dev/null || true
          git clean -fd app/src/main/assets/public 2>/dev/null || true
          git add -f debug/debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update debug/debug.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "Skipping git push (check branch protection/permissions); APK is available in job artifacts."
          fi
